<title>Invigilator Duty Finder</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: an exam-booklet blue band holds the search; below it, a week grid and one duty slip per sitting. */
:root{
  --bg:#EDF0F6;--surface:#FFFFFF;--fg:#141D33;--muted:#55607A;--line:#CDD4E2;
  --band:#17307E;--band-fg:#FFFFFF;--band-muted:#C5D0F2;--accent:#1F44B8;--accent-soft:#E2E8FA;
  --am:#7A4A00;--am-bg:#FFEFC9;--pm:#0A5B50;--pm-bg:#D2F0E8;--warn:#9A1F14;--warn-bg:#FCE5E1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --data:"IBM Plex Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524;--surface:#182136;--fg:#EAEEF8;--muted:#A3AEC6;--line:#2F3B58;
  --band:#14275F;--band-fg:#FFFFFF;--band-muted:#BAC6EC;--accent:#A9BEFF;--accent-soft:#233360;
  --am:#FFD27A;--am-bg:#40300F;--pm:#83E3CF;--pm-bg:#10413A;--warn:#FFB4A9;--warn-bg:#4A1F1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524;--surface:#182136;--fg:#EAEEF8;--muted:#A3AEC6;--line:#2F3B58;
  --band:#14275F;--band-fg:#FFFFFF;--band-muted:#BAC6EC;--accent:#A9BEFF;--accent-soft:#233360;
  --am:#FFD27A;--am-bg:#40300F;--pm:#83E3CF;--pm-bg:#10413A;--warn:#FFB4A9;--warn-bg:#4A1F1A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 1.0625rem/1.45 var(--body)}
.wrap{max-width:860px;margin-inline:auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-fg);padding-block:28px 26px}
h1{font:700 clamp(2.1rem,6vw,3.1rem)/1 var(--display);letter-spacing:.005em;margin:0;text-wrap:balance}
.sub{color:var(--band-muted);margin:8px 0 20px}
label{display:block;font-weight:600;margin-bottom:6px}
.field{position:relative}
#q{width:100%;height:60px;border:0;border-radius:6px;padding:0 54px 0 16px;font:600 1.3rem var(--body);background:var(--surface);color:var(--fg)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--muted);font-weight:400}
#q:focus-visible{outline:3px solid var(--band-muted);outline-offset:2px}
#clear{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:6px;background:var(--accent-soft);color:var(--fg);font-size:1.4rem;line-height:1;cursor:pointer}
main{padding-block:24px 40px}
.main-inner{display:grid;gap:24px}
h2{font:700 1.5rem/1.15 var(--display);margin:0;text-wrap:balance}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* name list */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:0 20px;margin:0;padding:0;list-style:none}
.names button{width:100%;min-height:46px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;color:var(--fg);font-size:1.0625rem;text-align:left;cursor:pointer}
.names button:hover{color:var(--accent)}
.names b{font-weight:700}
.count{font:500 .8rem var(--data);color:var(--muted);white-space:nowrap}
.group{display:grid;gap:8px}
.lede{margin:0;color:var(--muted)}
/* person */
.who{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.who>div{min-width:0}
.who h2{font-size:clamp(2rem,6vw,2.7rem);line-height:1.02}
.who p{margin:4px 0 0;color:var(--muted)}
.btn{min-height:44px;padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--accent);font-weight:600;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
#copybox{width:100%;height:150px;font:400 .9rem var(--body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
.week-scroll{overflow-x:auto}
.week{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--surface);min-width:340px}
.week th,.week td{border:1px solid var(--line);padding:0;text-align:center;font-size:.85rem}
.week thead th{padding:6px 2px;font-weight:600;line-height:1.1}
.week thead span{display:block;font:700 1.25rem/1.05 var(--display)}
.week th.rowh{width:58px;font-weight:700;font-size:.78rem}
.week td{height:50px;color:var(--muted)}
.week .todaycol{background:var(--accent-soft)}
.cell{width:100%;height:50px;border:0;cursor:pointer;font:700 .95rem/1.05 var(--display);padding:2px}
.cell.am{background:var(--am-bg);color:var(--am)}
.cell.pm{background:var(--pm-bg);color:var(--pm)}
.cell.clash{background:var(--warn-bg);color:var(--warn)}
.seg{display:inline-flex;justify-self:start;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;padding:6px 16px;border:0;border-right:1px solid var(--line);background:none;color:var(--fg);font-size:1rem;font-weight:600;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.day{display:grid;gap:10px;scroll-margin-top:12px}
.day h3{font:700 1.45rem/1.1 var(--display);margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:700 .72rem/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--accent);color:var(--surface)}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:175px minmax(0,1fr)}
.when{padding:14px;display:grid;align-content:start;gap:2px}
.when.am{background:var(--am-bg);color:var(--am)}
.when.pm{background:var(--pm-bg);color:var(--pm)}
.when strong{font:700 1.3rem/1.1 var(--display)}
.when span{font-size:.92rem;line-height:1.25}
.what{padding:12px 16px 14px;min-width:0;display:grid;gap:8px}
.venue{font:700 1.85rem/1.05 var(--display);margin:0}
.mods{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mods .mname{font-weight:600}
.code{font:500 .82rem var(--data);color:var(--muted);overflow-wrap:anywhere}
.also{margin:0;font-size:.95rem;color:var(--muted)}
.flag{margin:0;padding:10px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:.98rem}
.note{margin:0;font-size:.92rem;color:var(--muted)}
.reminders{border-top:1px solid var(--line);padding-top:16px}
.reminders ul{margin:0;padding-left:20px;display:grid;gap:6px}
.none{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.none strong{display:block;font:700 1.35rem/1.1 var(--display);margin-bottom:4px}
footer{padding-block:0 32px;color:var(--muted);font-size:.9rem}
footer p{margin:0;max-width:65ch}
@media (max-width:560px){
  .slip{grid-template-columns:minmax(0,1fr)}
  .when{grid-template-columns:auto 1fr;align-items:baseline;gap:10px;padding:10px 14px}
  .who .btn{width:100%}
  .seg{display:flex;justify-self:stretch}.seg button{flex:1;padding-inline:6px}
  .week th.rowh{width:50px;font-size:.66rem}
  .cell{font-size:.8rem;padding:2px 0}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

/* Build people */
const people=new Map();
function person(n){if(!people.has(n))people.set(n,{name:n,recs:[],roving:false,listed:new Set()});return people.get(n)}
for(const [n,listed,d,s,m,c,v,k] of RECS){const p=person(n);p.recs.push({d,s,m,c,v,k});p.listed.add(listed)}

for(const p of list){p.tokens=words(p.name);p.slug=p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');p.slips=slips(p);}

/* One slip per day, session and venue */
function slips(p){
  const map=new Map();
  for(const r of p.recs){const key=r.d+'|'+r.s+'|'+r.v;if(!map.has(key))map.set(key,{d:r.d,s:r.s,v:r.v,rove:r.rove,partner:r.partner,mods:[]});if(!r.rove)map.get(key).mods.push(r)}
  return [...map.values()].sort((a,b)=>a.d-b.d||a.s-b.s);
}
function colleagues(p,x){
  if(x.rove)return x.partner?[x.partner]:[];
  const o=new Set();for(const r of RECS)if(r[0]!==p.name&&r[2]===x.d&&r[3]===x.s&&r[6]===x.v)o.add(r[0]);return [...o];
}
function shortVenue(v){
  if(v.startsWith('Lecture Room'))return v.includes('-')?v.replace('Lecture Room ','LR '):'LR '+v.split(' ').pop();
  if(v.includes('Reading'))return 'Reading';if(v.includes('E-Library'))return 'E-Lib';if(v.includes('Book'))return 'Books';
  if(v.startsWith('Lab 1-5'))return 'Labs';if(v==='Library')return 'Library';return v;
}

/* Search: exact or prefix first, then near spellings */
function dist(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const allTokens=[...new Set(list.flatMap(p=>p.tokens))];
function near(w,t){if(w.length<4)return false;const lim=w.length>=7?2:1;return dist(w,t)<=lim||dist(w,t.slice(0,w.length))<=(w.length>=7?2:1)}
function search(text){
  const qs=words(text);if(!qs.length)return null;
  const scored=list.map(p=>{let score=0,real=0;for(const w of qs){
    const exact=allTokens.some(t=>t.startsWith(w));let best=0,solid=false;
    for(const t of p.tokens){
      if(t.length===1&&!/\d/.test(t)){if(w[0]===t)best=Math.max(best,.5)}
      else if(t.startsWith(w)){best=Math.max(best,t===w?1.1:1);solid=true}
      else if(!exact&&near(w,t)){best=Math.max(best,.8);solid=true}
      else if(/\d/.test(t)&&t===w){best=1;solid=true}
    }
    score+=best;if(solid)real++}
    return {p,score,real}}).filter(x=>x.real>0);
  if(!scored.length)return [];
  const max=Math.max(...scored.map(x=>x.score));
  return scored.filter(x=>x.score>=max-.001).map(x=>x.p);
}

/* Time */
function nowInfo(){const n=new Date();return {now:n,today:(n.getFullYear()===2026&&n.getMonth()===10&&n.getDate()>=2&&n.getDate()<=7)?n.getDate():null}}
function nextSlip(p){const {now}=nowInfo();return p.slips.find(x=>new Date(2026,10,x.d,SESS[x.s].end[0],SESS[x.s].end[1])>now)}

function nameLabel(n){const parts=n.split(' ');const i=parts.findIndex(w=>w.replace(/[().]/g,'').toLowerCase()===surname(n).toLowerCase());return parts.map((w,k)=>k===i?'<b>'+esc(w)+'</b>':esc(w)).join(' ')}
function dutyCount(p){const n=p.slips.length;return n+(n===1?' duty':' duties')}

  out.innerHTML='<div class="group"><p class="eyebrow">'+ms.length+' names match. Pick yours.</p><ul class="names">'+ms.map(row).join('')+'</ul></div>';
}

function plainText(p){
  const lines=[p.name+': invigilation duties, 2 to 7 November 2026'];

  if(b.dataset.jump){if(filter!=='all'){filter='all';showPerson(current)}const t=$('day-'+b.dataset.jump);if(t)t.scrollIntoView();return}
  if(b.id==='copy'){const text=plainText(current);
    try{await navigator.clipboard.writeText(text);b.textContent='Copied'}
    catch(err){const box=$('copybox');box.value=text;box.hidden=false;box.focus();box.select();b.textContent='Select and copy the text below'}
    setTimeout(()=>{if(b.isConnected)b.textContent='Copy my schedule'},2500)}
});
function fromHash(){const s=location.hash.slice(1);const p=list.find(x=>x.slug===s);if(p){q.value=p.name;clearBtn.hidden=false;showPerson(p);return true}return false}
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==(current&&current.slug))fromHash()});
if(!fromHash())showAll();
</script>
